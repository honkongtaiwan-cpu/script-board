<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>製片腳本工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
html, body { margin: 0; } img { max-width: 100%; }
/* Layout: production-office board — project rail on the left, a shooting-script sheet on the right, slate-style labels. */
:root {
  --paper: #ECEEF0;
  --sheet: #FFFFFF;
  --sheet-2: #F6F7F8;
  --ink: #17202A;
  --muted: #5B6875;
  --line: #D2D7DD;
  --accent: #C2410C;
  --accent-soft: #FBE7DC;
  --on-accent: #FFFFFF;
  --ok: #2E7A4C;
  --ok-soft: #DDF0E4;
  --warn: #A66A12;
  --warn-soft: #F7ECD6;
  --danger: #B42318;
  --shadow: 0 1px 2px rgb(23 32 42 / .06), 0 8px 24px rgb(23 32 42 / .06);
  --f-display: "Barlow Condensed", "Noto Sans TC", "PingFang TC", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161B; --sheet: #192027; --sheet-2: #1F272F; --ink: #E5E9ED; --muted: #94A1AE; --line: #2D3741;
  --accent: #F0783A; --accent-soft: #3A2419; --on-accent: #1A0F09; --ok: #62C08A; --ok-soft: #1B3326;
  --warn: #E2A94C; --warn-soft: #382B15; --danger: #F07167; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11161B; --sheet: #192027; --sheet-2: #1F272F; --ink: #E5E9ED; --muted: #94A1AE; --line: #2D3741;
  --accent: #F0783A; --accent-soft: #3A2419; --on-accent: #1A0F09; --ok: #62C08A; --ok-soft: #1B3326;
  --warn: #E2A94C; --warn-soft: #382B15; --danger: #F07167; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
/* phones zoom the page when a field under 16px gets focus */
@media (pointer: coarse) { input, select, textarea, .cell { font-size: 16px !important; } }
button, label.btn { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: var(--muted); }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 16px; max-width: 1480px; margin: 0 auto; min-height: calc(100% - 0px); }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* rail */
.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 2px; }
.brand b { font-family: var(--f-display); font-size: 22px; letter-spacing: .04em; }
.brand span { color: var(--muted); font-size: 12px; }
.mode { font-size: 12px; color: var(--muted); padding: 0 2px; }
.mode.warn { color: var(--warn); }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.pitem { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.pitem:hover { border-color: var(--muted); }
.pitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.pitem .t { font-weight: 700; overflow-wrap: anywhere; }
.pitem .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

body.home .app { grid-template-columns: minmax(0, 1fr); max-width: 1100px; }
body.home .main { display: none; }
body.home .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
body.home .search { max-width: 420px; }
.rail-top { display: grid; gap: 10px; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumb .btn { padding: 4px 8px; }
.folder-name { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; background: transparent; }
.folder-name:hover, .folder-name:focus { border-color: var(--line); background: var(--sheet); }
.fitem { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.fitem:hover { border-color: var(--muted); }
.fitem[aria-current="true"] { border-color: var(--accent); }
.fitem svg { grid-row: span 2; width: 26px; height: 22px; color: var(--accent); }
.fitem.none svg { color: var(--muted); }
.fitem .t { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.fitem .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); grid-row: span 2; }
.fitem .sub { font-size: 12px; color: var(--muted); }
.pitem .f { font-size: 11px; color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sheet-2); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* main */
.main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.head { padding: 16px 18px; display: grid; gap: 14px; }
.title-row { display: flex; gap: 10px; align-items: center; min-width: 0; }
.title-row .title-in { flex: 1; }
.title-row .btn.danger:hover { border-color: var(--danger); }
.title-row .btn.armed { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
.title-in { font-family: var(--f-body); font-weight: 700; font-size: 22px; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; background: transparent; width: 100%; min-width: 0; }
.title-in:hover, .title-in:focus { border-color: var(--line); background: var(--sheet-2); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field { display: grid; gap: 2px; min-width: 0; }
.field input { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--sheet-2); width: 100%; min-width: 0; }

/* stage stepper — reads like a slate's take boxes */
.stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stage { border: 0; border-right: 1px solid var(--line); background: var(--sheet-2); padding: 8px 6px; display: grid; gap: 1px; text-align: left; min-width: 0; }
.stage:last-child { border-right: 0; }
.stage small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.stage span { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.stage.done { background: var(--ok-soft); }
.stage.done small { color: var(--ok); }
.stage.now { background: var(--accent); color: var(--on-accent); }
.stage.now small { color: var(--on-accent); opacity: .85; }
@media (max-width: 560px) { .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stage:nth-child(3) { border-right: 0; } .stage:nth-child(-n+3) { border-bottom: 1px solid var(--line); } }

.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: grid; }
.stat b { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; }
.tab { border: 0; background: none; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }

/* script sheet */
.sheet-wrap { overflow-x: auto; }
table.sheet { border-collapse: collapse; width: 100%; min-width: 1080px; table-layout: fixed; }
.sheet th { position: sticky; top: 0; background: var(--sheet-2); text-align: left; font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; font-size: 12px; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; padding: 0; }
.sheet td:last-child { border-right: 0; }
.sheet tr:hover td { background: color-mix(in srgb, var(--sheet-2) 60%, transparent); }
.cell { display: block; width: 100%; border: 0; background: transparent; padding: 8px 6px; resize: none; min-height: 38px; line-height: 1.5; overflow: hidden; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--sheet); }
.cell.mono { font-size: 13px; }
.sheet .idx { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 9px 6px; text-align: right; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; background: var(--sheet-2); margin: 7px 6px; white-space: nowrap; }
.chip[data-s="1"] { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip[data-s="2"] { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.rowops { display: flex; flex-wrap: wrap; gap: 0; padding: 4px; }
.rowops button { border: 0; background: none; color: var(--muted); padding: 3px 5px; border-radius: 4px; font-size: 12px; }
.rowops button:hover { background: var(--sheet-2); color: var(--ink); }
.rowops button.armed { color: var(--on-accent); background: var(--danger); }
.scene-break td { border-top: 2px solid var(--ink); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { margin: 0; color: var(--ink); font-size: 16px; }

/* plan sheet */
table.plan-sheet { min-width: 520px; }
.plan-sheet .pk { font-weight: 500; }
.plan { padding: 14px 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.plan .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .plan { grid-template-columns: minmax(0, 1fr); } }
.pcell { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sheet-2); resize: vertical; min-height: 44px; line-height: 1.6; overflow: hidden; }
.pcell:focus { background: var(--sheet); border-color: var(--accent); outline: none; }
.pcell.body { min-height: 200px; }

/* progress checklist */
.progress { padding: 16px; display: grid; gap: 14px; max-width: 640px; }
.pg-head { display: flex; align-items: center; gap: 12px; }
.pg-head .bar { height: 6px; }
.pg-list { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pg-item { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--sheet); }
.pg-item:last-child { border-bottom: 0; }
.pg-item:hover { background: var(--sheet-2); }
.pg-item input { width: 18px; height: 18px; accent-color: var(--ok); }
.pg-no { color: var(--muted); font-size: 12px; }
.pg-name { font-weight: 500; font-size: 15px; }
.pg-date { color: var(--ok); font-size: 12px; }
.pg-item.done { background: var(--ok-soft); }
.pg-item.done .pg-name { color: var(--ok); }

/* todo */
.todo { padding: 12px 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .todo { grid-template-columns: minmax(0, 1fr); } }
.tlist { display: grid; gap: 4px; }
.titem { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.titem input[type=text] { border: 0; background: transparent; padding: 4px 2px; width: 100%; }
.titem.done input[type=text] { text-decoration: line-through; color: var(--muted); }
textarea.notes { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--sheet-2); resize: vertical; }

/* import */
.overlay { position: fixed; inset: 0; background: rgb(10 14 18 / .5); display: grid; place-items: center; padding: 16px; z-index: 10;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { width: min(760px, 100%); max-height: calc(100% - 16px); overflow: auto; padding: 18px; display: grid; gap: 14px; }
.modal h2 { margin: 0; font-size: 18px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; display: grid; gap: 6px; justify-items: center; background: var(--sheet-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop small { color: var(--muted); }
textarea.paste { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--sheet-2); font-family: var(--f-mono); font-size: 12px; }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.preview table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 12px; }
.preview th, .preview td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.preview th { background: var(--sheet-2); color: var(--muted); font-weight: 500; }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--danger); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
.readonly .cell, .readonly input, .readonly textarea { pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .pitem, .btn, .stage { transition: border-color .15s, background-color .15s; } }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><b>SCRIPT BOARD</b><span>製片腳本工作台</span></div>
    <div class="mode" id="mode">連線中…</div>
    <div id="railTop" class="rail-top"></div>
    <input class="search" id="search" type="search" placeholder="搜尋所有專案或客戶" aria-label="搜尋專案">
    <div class="plist" id="plist"></div>
    <div id="railFoot" class="row"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="overlay" id="importOverlay" hidden>
  <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <div class="row" style="justify-content:space-between">
      <h2 id="impTitle">上傳腳本</h2>
      <button class="btn ghost" id="impClose" type="button">關閉</button>
    </div>
    <label class="drop" id="drop" for="impFile">
      <b>拖曳檔案到這裡，或點一下選擇檔案</b>
      <small>支援 Excel（.xlsx .xls）、Numbers、CSV、Word（.docx）、純文字（.txt .md .fountain）</small>
      <input id="impFile" type="file" accept=".xlsx,.xls,.numbers,.csv,.docx,.txt,.md,.fountain" hidden>
    </label>
    <div class="field">
      <span class="label">或直接貼上</span>
      <textarea class="paste" id="impPaste" placeholder="貼上腳本文字，或從 Excel／Google 試算表複製整張表格貼過來"></textarea>
    </div>
    <div class="msg" id="impMsg">表格會依欄名自動對應：場次、場景、畫面、台詞／旁白、鏡頭、秒數、備註。文字腳本會依「第1場／S1／內景／INT.」分場，「角色：台詞」歸到台詞欄。</div>
    <div class="preview" id="impPreview" hidden></div>
    <div class="row" id="impActions" hidden>
      <button class="btn primary" id="impAppend" type="button">加到目前腳本後面</button>
      <button class="btn" id="impReplace" type="button">取代目前腳本</button>
      <button class="btn primary" id="impCreate" type="button">建立新專案</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STAGES = ['企劃', '腳本', '分鏡', '拍攝／生成', '後製', '交片'];
const SHOT_STATUS = ['待辦', '進行中', '完成'];
const COLS = [
  { k: 'shot', label: '鏡號', w: 60, mono: true },
  { k: 'scene', label: '場次', w: 64, mono: true },
  { k: 'location', label: '場景／地點', w: 130 },
  { k: 'visual', label: '畫面描述', w: null },
  { k: 'audio', label: '台詞／旁白', w: null },
  { k: 'camera', label: '鏡頭／運鏡', w: 130 },
  { k: 'dur', label: '秒數', w: 62, mono: true },
  { k: 'note', label: '備註', w: 150 },
];
const LS_KEY = 'script-board-local-v1';

const UI_KEY = 'script-board-ui';
const state = { folders: new Map(), projects: new Map(), shots: new Map(), folder: null, sel: null, tab: 'script', q: '', canWrite: true, mode: 'loading' };
try { const ui = JSON.parse(localStorage.getItem(UI_KEY) || '{}'); state.folder = ui.folder ?? null; state.sel = ui.sel ?? null; } catch {}
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify({ folder: state.folder, sel: state.sel })); } catch {} }
let db = null, downloads = null, pendingRender = false, importCtx = null, parsedRows = null, parsedName = '';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.]/g, '')); return isFinite(n) ? n : 0; };
const fmtDur = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

/* ---------- storage: Supabase (tables board_folders / board_projects / board_shots: id, user_id, data jsonb) ---------- */
const cfg = window.SCRIPT_BOARD_CONFIG || {};
const sb = cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase ? supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;
const T = { folders: 'board_folders', projects: 'board_projects', shots: 'board_shots' };
let lastLoad = 0;

async function sbWrite(q) { const { error } = await q; if (error) throw error; }
const strip = o => { const { id, ...d } = o || {}; return d; };
function put(kind, id, d) {
  state[kind].set(id, { id, ...d }); scheduleRender();
  return sbWrite(sb.from(T[kind]).upsert({ id, data: d, updated_at: new Date().toISOString() }));
}
const patch = (kind, id, p) => put(kind, id, { ...strip(state[kind].get(id)), ...p });
function del(kind, id) { state[kind].delete(id); scheduleRender(); return sbWrite(sb.from(T[kind]).delete().eq('id', id)); }
const api = {
  setFolder: (id, d) => put('folders', id, d), updateFolder: (id, p) => patch('folders', id, p), delFolder: id => del('folders', id),
  setProject: (id, d) => put('projects', id, d), updateProject: (id, p) => patch('projects', id, p), delProject: id => del('projects', id),
  setShot: (id, d) => put('shots', id, d), updateShot: (id, p) => patch('shots', id, p), delShot: id => del('shots', id),
};
async function guard(p) {

    if (error) throw error;

}
async function backupUpload(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch { toast('這不是有效的備份檔。'); return; }
  const kinds = ['folders', 'projects', 'shots'];
  if (!kinds.some(k => Array.isArray(d[k]))) { toast('備份檔裡沒有資料夾、專案或鏡頭。'); return; }
  toast('匯入中…');
  try {
    for (const k of kinds) {
      const rows = (d[k] || []).filter(r => r?.id && r.data).map(r => ({ id: r.id, data: r.data, updated_at: new Date().toISOString() }));
      for (let i = 0; i < rows.length; i += 500) await sbWrite(sb.from(T[k]).upsert(rows.slice(i, i + 500)));

    await loadAll();
    toast(`已匯入 ${(d.folders || []).length} 個資料夾、${(d.projects || []).length} 個專案、${(d.shots || []).length} 鏡`);

}

  if (out.length > 1 && /^(項目|欄位|類別|item)$/i.test(out[0].k) && /^(內容|說明|content)?$/i.test(out[0].v)) out.shift();

/* ---------- import: parse files and pasted text into shot rows ---------- */
const FIELD_KEYS = [
  ['location', ['場景', '地點', '景點', 'location', 'loc', 'set']],
  ['shot', ['鏡號', '鏡次', 'shot', 'cut', '#', 'no']],
  ['scene', ['場次', '場號', 'scene', 'sc']],
  ['visual', ['畫面', '內容', '描述', '動作', '影像', 'visual', 'action', 'description', 'video', 'picture']],
  ['audio', ['台詞', '對白', '旁白', '聲音', '字幕', '音效', 'audio', 'dialogue', 'dialog', 'vo', 'sound']],
  ['camera', ['鏡頭', '景別', '運鏡', '角度', '攝影', 'camera', 'angle', 'lens', 'move']],
  ['dur', ['秒', '時長', '長度', '時間', 'duration', 'dur', 'sec', 'time']],
  ['note', ['備註', '道具', '服裝', 'note', 'notes', 'remark', 'props']],
  ['status', ['狀態', 'status']],
];
function mapHeader(row) {
  const map = {}, used = new Set();
  row.forEach((h, i) => {
    const s = String(h).trim().toLowerCase(); if (!s) return;
    for (const [k, words] of FIELD_KEYS) {
      if (used.has(k)) continue;
      const hit = words.some(w => w.length <= 3 && /^[a-z#]+$/.test(w) ? s === w || s.startsWith(w + ' ') || s.startsWith(w + '.') : s.includes(w));
      if (hit || (k === 'scene' && s === '場')) { map[i] = k; used.add(k); return; }
    }
  });
  return map;
}
function tableToShots(rows) {
  rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  if (!rows.length) return [];
  let map = mapHeader(rows[0]), start = 1;
  if (Object.keys(map).length < 2) { map = {}; ['shot', 'scene', 'location', 'visual', 'audio', 'camera', 'dur', 'note'].forEach((k, i) => map[i] = k); start = 0; if (rows[0].length === 1) map = { 0: 'visual' }; }
  return rows.slice(start).map(r => {
    const o = {}; r.forEach((v, i) => { const k = map[i]; if (k) o[k] = o[k] ? o[k] + '\n' + v : v; });
    if (o.status != null) { const i = SHOT_STATUS.findIndex(x => o.status.includes(x)); o.status = i < 0 ? (/done|完/i.test(o.status) ? 2 : 0) : i; }
    return o;
  }).filter(o => COLS.some(c => o[c.k]));
}
const SCENE_RE = /^\s*(?:(第\s*[0-9０-９一二三四五六七八九十百]+\s*場)|(場\s*[0-9]+)|(S(?:C|cene)?\.?\s*\d+[A-Z]?)|(\d+[A-Z]?)\s*[\.、:：]\s*(?=內|外|INT|EXT)|(?=(?:INT|EXT|I\/E)\.?\s)|(?=內景|外景|內\/外))\s*(.*)$/i;
function textToShots(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const tabby = lines.filter(l => l.includes('\t')).length;
  if (tabby >= 2 && tabby >= lines.filter(l => l.trim()).length * .6) return tableToShots(lines.map(l => l.split('\t')));
  const out = []; let scene = '', location = '', sceneNo = 0, cur = null;
  for (const raw of lines) {
    const l = raw.trim(); if (!l) { cur = cur && (cur.visual || cur.audio) ? null : cur; continue; }
    const m = l.match(SCENE_RE);
    if (m && l.length < 80) {
      sceneNo++;
      const tag = (m[1] || m[2] || m[3] || m[4] || '').replace(/\s+/g, '');
      scene = (tag.match(/[0-9０-９]+[A-Z]?/i)?.[0]) || (tag ? tag : String(sceneNo));
      location = (m[5] || l).replace(/^[\s\-–—:：、.]+/, '').trim() || l;
      cur = null; continue;
    }
    const durM = l.match(/[（(]?\s*(\d+(?:\.\d+)?)\s*(?:s|秒|sec)\s*[)）]?/i);
    const dlg = l.match(/^([^：:\s]{1,12})\s*[：:]\s*(.+)$/);
    if (dlg && !/^(畫面|鏡頭|備註)$/.test(dlg[1])) {
      if (!cur) { cur = { scene, location, visual: '', audio: '' }; out.push(cur); }
      cur.audio = (cur.audio ? cur.audio + '\n' : '') + `${dlg[1]}：${dlg[2]}`;
    } else {
      cur = { scene, location, visual: l, audio: '' }; out.push(cur);
    }
    if (durM && !cur.dur) cur.dur = durM[1];
  }
  return out;
}
function htmlTables(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tables = [...doc.querySelectorAll('table')].map(t => [...t.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.innerText ?? td.textContent)));
  return tables.sort((a, b) => b.length - a.length)[0];
}
async function parseFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (['xlsx', 'xls', 'numbers', 'csv'].includes(ext)) {
    if (!window.XLSX) throw new Error('試算表元件沒有載入，請重新整理頁面。');
    const wb = ext === 'csv' ? XLSX.read(await file.text(), { type: 'string' }) : XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }));
    return tableToShots(sheets.sort((a, b) => b.length - a.length)[0] || []);
  }
  if (ext === 'docx') {
    if (!window.mammoth) throw new Error('Word 元件沒有載入，請重新整理頁面。');
    const buf = await file.arrayBuffer();
    const { value: html } = await mammoth.convertToHtml({ arrayBuffer: buf });
    const t = htmlTables(html);
    if (t && t.length >= 2) return tableToShots(t);
    const { value: text } = await mammoth.extractRawText({ arrayBuffer: buf });
    return textToShots(text);
  }
  if (['txt', 'md', 'fountain'].includes(ext)) return textToShots(await file.text());
  if (ext === 'pdf') throw new Error('PDF 無法直接讀取，請先另存成 Word 或文字檔，或把內容複製貼上。');
  throw new Error('不支援這種檔案，請用 Excel、CSV、Word 或文字檔。');
}

    if (mode === 'replace') await guard(inChunks(shotsOf(pid).map(r => r.id), id => api.delShot(id)));
    const base = mode === 'append' ? (shotsOf(pid).at(-1)?.order ?? 0) : 0, offset = mode === 'append' ? shotsOf(pid).length : 0;
    const docs = parsedRows.map((r, i) => [uid('s') + i, {
      projectId: pid, order: base + i + 1, shot: r.shot || String(offset + i + 1), scene: r.scene || '', location: r.location || '',
      visual: r.visual || '', audio: r.audio || '', camera: r.camera || '', dur: r.dur || '', note: r.note || '', status: r.status || 0,
    }]);
    await guard(inChunks(docs, ([id, d]) => api.setShot(id, d)));
    state.sel = pid; state.tab = 'script'; closeImport(); render();
    toast(`已匯入 ${docs.length} 鏡`);
  } catch { } finally { btns.forEach(b => b.disabled = false); }
}
$('#impAppend').onclick = () => commitImport('append');
$('#impReplace').onclick = () => commitImport('replace');
$('#impCreate').onclick = () => commitImport('new');

/* ---------- export ---------- */
const HEAD = [...COLS.map(c => c.label), '狀態'];
const rowOut = r => [...COLS.map(c => c.k === 'dur' && r.dur !== '' && isFinite(+r.dur) ? +r.dur : (r[c.k] ?? '')), SHOT_STATUS[r.status || 0]];
async function offer(filename, data) {
  if (downloads) {
    try { await downloads.save({ filename, data }); toast('已下載 ' + filename); }
    catch (e) { if (e?.code !== 'declined') toast('下載沒有完成，請再試一次。'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename; a.click();
}
function safeSheet(name, used) {
  let n = (name || '專案').replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 28) || '專案', k = n, i = 2;
  while (used.has(k)) k = n.slice(0, 26) + '_' + i++;
  used.add(k); return k;
}
function exportXlsx(projects, title) {
  if (!window.XLSX) { toast('試算表元件沒有載入，請重新整理頁面。'); return; }
  if (!projects.length) { toast('沒有可匯出的專案。'); return; }
  const wb = XLSX.utils.book_new(), used = new Set(['總覽']);
  const overview = [['資料夾', '專案', '客戶', '規格', '階段', '交期', ...MILESTONES.map(m => m[1]), '鏡頭數', '已完成', '總秒數', '待辦未完成']].concat(projects.map(p => {
    const s = projStats(p.id);
    return [folderName(folderOf(p)), p.name, p.client || '', p.spec || '', STAGES[p.stage ?? 0], p.due || '', ...MILESTONES.map(([k]) => p.progress?.[k]?.done ? '✓ ' + (p.progress[k].at || '') : ''), s.total, s.done, s.dur, (p.tasks || []).filter(t => !t.done).length];
  }));
  const ov = XLSX.utils.aoa_to_sheet(overview); ov['!cols'] = [14, 30, 16, 14, 10, 12, 12, 12, 12, 12, 12, 8, 8, 8, 10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ov, '總覽');
  for (const p of projects) {
    const rows = shotsOf(p.id);
    const pr = planRows(p).map(r => ['', r.k, r.v]);
    const aoa = [[p.name, `資料夾：${folderName(folderOf(p))}`], [`客戶：${p.client || '—'}`, `規格：${p.spec || '—'}`, `交期：${p.due || '—'}`, `階段：${STAGES[p.stage ?? 0]}`], [],
      ...(pr.length ? [['企劃表'], ['', '項目', '內容'], ...pr, []] : []),
      ['腳本表'], ['#', ...HEAD], ...rows.map((r, i) => [i + 1, ...rowOut(r)])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [4, 6, 6, 16, 40, 32, 16, 6, 20, 8].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, safeSheet(p.name, used));
  }
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  const name = title ? `${title}_${new Date().toISOString().slice(0, 10)}.xlsx` : `${projects[0].name || '專案'}_腳本.xlsx`;
  offer(name, new Blob([buf]));
}
function exportCsv(p) {
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = '﻿' + [HEAD, ...shotsOf(p.id).map(rowOut)].map(r => r.map(q).join(',')).join('\r\n');
  offer(`${p.name || '專案'}_腳本.csv`, new Blob([csv]));
}
async function copyTsv(p) {
  const clean = v => String(v ?? '').replace(/\t/g, ' ').replace(/\n/g, ' / ');
  const tsv = [HEAD, ...shotsOf(p.id).map(rowOut)].map(r => r.map(clean).join('\t')).join('\n');
  try { await navigator.clipboard.writeText(tsv); toast('已複製，可以直接貼到 Excel 或 Google 試算表'); }
  catch { toast('這個環境不允許複製，請改用「匯出 Excel」。'); }
}

boot();
